name: Windows prototype

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-prototype-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-tray:
    name: Windows x64 portable app
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Build and test portable app
        run: python source/Windows/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: TGFocus-Windows-test-x64
          path: |
            dist/TGFocus-Windows-x64.zip
            dist/TGFocus-Windows-x64.zip.sha256
          if-no-files-found: error
