name: Windows prototype

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scan_run_id:
        description: 'Scan an existing Windows artifact from this workflow run (empty = build)'
        required: false
        type: string
      compare_icons:
        description: 'Build a matched pair with and without embedded EXE icons'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: windows-prototype-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-tray:
    if: ${{ !inputs.scan_run_id && !inputs.compare_icons }}
    name: Windows x64 portable app
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Build and test portable app
        run: python source/Windows/build.py
      - name: Scan portable package with current Defender signatures
        shell: pwsh
        env:
          TGFOCUS_SOURCE_RUN: ${{ github.run_id }}
        run: ./.github/scripts/scan-windows-package.ps1 -ArtifactDirectory dist -ReportDirectory security-report
      - uses: actions/upload-artifact@v4
        with:
          name: TGFocus-Windows-test-x64
          path: |
            dist/TGFocus-Windows-x64.zip
            dist/TGFocus-Windows-x64.zip.sha256
          if-no-files-found: error
      - name: Keep scan evidence even if the scan fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TGFocus-Windows-security-report
          path: security-report
          if-no-files-found: warn

  compare-icons:
    name: Compare embedded EXE icons
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.compare_icons && !inputs.scan_run_id }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      TGFOCUS_SOURCE_RUN: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Build and test with embedded icons
        run: python source/Windows/build.py
      - name: Scan package with embedded icons
        shell: pwsh
        run: ./.github/scripts/scan-windows-package.ps1 -ArtifactDirectory dist -ReportDirectory security-report/custom
      - name: Stage first package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path icon-comparison | Out-Null
          Move-Item -LiteralPath dist -Destination icon-comparison/custom
      - name: Build and test without embedded icons in the same environment
        run: python source/Windows/build.py --without-exe-icons
      - name: Scan package without embedded icons
        shell: pwsh
        run: ./.github/scripts/scan-windows-package.ps1 -ArtifactDirectory dist -ReportDirectory security-report/none
      - name: Stage second package
        shell: pwsh
        run: Move-Item -LiteralPath dist -Destination icon-comparison/none
      - uses: actions/upload-artifact@v4
        with:
          name: TGFocus-Windows-icons-custom
          path: |
            icon-comparison/custom/TGFocus-Windows-x64.zip
            icon-comparison/custom/TGFocus-Windows-x64.zip.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: TGFocus-Windows-icons-none
          path: |
            icon-comparison/none/TGFocus-Windows-x64.zip
            icon-comparison/none/TGFocus-Windows-x64.zip.sha256
          if-no-files-found: error
      - name: Keep both scan reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TGFocus-Windows-icon-comparison-reports
          path: security-report
          if-no-files-found: warn

  scan-existing:
    name: Defender check of existing Windows artifact
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.scan_run_id != '' }}
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TGFocus-Windows-test-x64
          path: security-input
          run-id: ${{ inputs.scan_run_id }}
          github-token: ${{ github.token }}
      - name: Verify archive and scan without remediation
        shell: pwsh
        env:
          TGFOCUS_SOURCE_RUN: ${{ inputs.scan_run_id }}
        run: ./.github/scripts/scan-windows-package.ps1 -ArtifactDirectory security-input -ReportDirectory security-report
      - name: Keep scan evidence even if the scan fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TGFocus-Windows-security-report
          path: security-report
          if-no-files-found: warn
