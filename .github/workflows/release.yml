name: Build macOS DMG

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test on macOS 15
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check build platform
        run: test "$(uname -m)" = arm64
      - name: Install DMG packaging tools
        run: brew install coreutils
      - name: Build app and run Python, native, and worker checks
        run: python source/build.py
      - name: Package and verify unsigned DMG
        run: bash source/package_dmg.sh
      - name: Test installation from DMG
        run: bash source/tests/smoke_dmg.sh
      - uses: actions/upload-artifact@v7
        with:
          name: TGFocus-unsigned-arm64
          path: |
            dist/TGFocus-unsigned-arm64.dmg
            dist/TGFocus-unsigned-arm64.dmg.sha256
          if-no-files-found: error
  macos26:
    name: Test release DMG on macOS 26
    needs: build
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: TGFocus-unsigned-arm64
          path: dist
      - run: bash source/tests/smoke_dmg.sh
  draft:
    name: Create draft from the verified DMG
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, macos26]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TGFocus-unsigned-arm64
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum -c TGFocus-unsigned-arm64.dmg.sha256)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'A release already exists for this tag; refusing to replace its assets.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            dist/TGFocus-unsigned-arm64.dmg \
            dist/TGFocus-unsigned-arm64.dmg.sha256 \
            --verify-tag --draft --title "TGFocus $RELEASE_TAG" \
            --notes-file RELEASE_NOTES.md
